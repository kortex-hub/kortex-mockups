<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaiden — Welcome</title>
        <script src="../assets/js/kaiden-theme.js"></script>
<link rel="stylesheet" href="../assets/css/styles.css">
    <style>
        body.welcome-page {
            background: var(--kd-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
        }

        .welcome-container {
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 28px;
        }

        .welcome-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: var(--kd-text-primary);
            letter-spacing: -0.01em;
        }

        .welcome-logo-icon {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: var(--kd-accent);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .welcome-logo-icon svg {
            width: 18px;
            height: 18px;
            color: var(--kd-on-accent);
        }

        .welcome-card {
            width: 100%;
            background: linear-gradient(145deg, var(--kd-bg-card) 0%, var(--kd-bg) 100%);
            border: 1px solid var(--kd-border);
            border-radius: 16px;
            padding: 40px 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .welcome-icon-wrap {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(79, 195, 247, 0.15) 0%, rgba(42, 139, 191, 0.08) 100%);
            border: 1px solid rgba(79, 195, 247, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .welcome-icon-wrap svg {
            width: 36px;
            height: 36px;
            color: var(--kd-accent);
        }

        .welcome-card h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--kd-text-primary);
            margin: 0;
            letter-spacing: -0.02em;
        }

        .welcome-card p {
            font-size: 15px;
            color: var(--kd-text-muted);
            line-height: 1.65;
            margin: 0;
            max-width: 420px;
        }

        .welcome-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 320px;
            margin-top: 8px;
        }

        .welcome-btn {
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            text-decoration: none;
            font-family: inherit;
        }

        .welcome-btn svg {
            width: 16px;
            height: 16px;
        }

        .welcome-btn-primary {
            background: var(--kd-accent);
            color: var(--kd-on-accent);
        }

        .welcome-btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(79, 195, 247, 0.4);
        }

        .welcome-btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--kd-border);
            color: var(--kd-text-muted);
        }

        .welcome-btn-secondary:hover {
            border-color: var(--kd-text-muted);
            color: var(--kd-text-primary);
        }

    </style>
</head>
<body class="welcome-page">
    <div class="welcome-container">
        <div class="welcome-logo">
            <div class="welcome-logo-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
            </div>
            <span>Kaiden</span>
        </div>

        <div class="welcome-card">
            <div class="welcome-icon-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 16v-4"/>
                    <path d="M12 8h.01"/>
                </svg>
            </div>
            <h1>Welcome to Kaiden</h1>
            <p>
                You are a short walk away from coding agents that understand your repos, run under clear policies, and use the models you trust. Guided setup connects LLMs, agents, and project guardrails in order—so your first workspace opens ready to build.
            </p>
            <div class="welcome-actions">
                <a class="welcome-btn welcome-btn-primary" href="../onboarding/index.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
                    Start guided setup
                </a>
            </div>
        </div>
    </div>
</body>
</html>
