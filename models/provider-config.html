<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaiden · Configure provider</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <script src="../assets/js/sidebar-loader.js"></script>
    <style>
        :root {
            --vault-pd-accent: #8b5cf6;
            --vault-pd-accent-dim: #7c3aed;
            --vault-pd-border: #3d3e4f;
            --vault-pd-muted: #9ca3af;
        }

        .provider-config-layout {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 32px);
            overflow: hidden;
        }

        .provider-config-main {
            flex: 1;
            overflow-y: auto;
            padding: 28px 40px 48px;
            min-width: 0;
        }

        .provider-config-main::-webkit-scrollbar { width: 6px; }
        .provider-config-main::-webkit-scrollbar-track { background: transparent; }
        .provider-config-main::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.2); border-radius: 3px; }

        .provider-config-inner { max-width: 560px; }

        .vault-create-breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .vault-create-breadcrumb a {
            color: var(--vault-pd-muted);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .vault-create-breadcrumb a:hover { color: #c4b5fd; }

        .vault-create-breadcrumb svg {
            width: 14px;
            height: 14px;
            color: #6b7280;
            flex-shrink: 0;
        }

        .vault-create-breadcrumb span { color: #e5e7eb; font-weight: 500; }

        .vault-create-title {
            font-size: 26px;
            font-weight: 700;
            color: #f4f4f5;
            letter-spacing: -0.02em;
            margin: 0 0 8px;
            line-height: 1.15;
        }

        .vault-create-lead {
            font-size: 14px;
            color: var(--vault-pd-muted);
            line-height: 1.55;
            margin: 0 0 28px;
        }

        .vault-create-callout {
            display: flex;
            gap: 12px;
            padding: 14px 16px;
            margin-bottom: 28px;
            border-radius: 10px;
            border: 1px solid rgba(139, 92, 246, 0.25);
            background: rgba(139, 92, 246, 0.06);
            font-size: 13px;
            color: #a1a1aa;
            line-height: 1.5;
        }

        .vault-create-callout svg {
            width: 20px;
            height: 20px;
            color: #a78bfa;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .vault-create-form { display: flex; flex-direction: column; gap: 22px; }

        .vault-field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #e5e7eb;
            margin-bottom: 8px;
        }

        .vault-field .vault-field-hint {
            font-weight: 400;
            color: #6b7280;
            margin-left: 4px;
        }

        .vault-input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px 14px;
            background: #1a1b23;
            border: 1px solid var(--vault-pd-border);
            border-radius: 10px;
            color: #e5e7eb;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.15s ease;
        }

        .vault-input:focus {
            outline: none;
            border-color: var(--vault-pd-accent);
        }

        .vault-input::placeholder { color: #6b7280; }

        .vault-form-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 12px;
            padding-top: 28px;
            border-top: 1px solid rgba(61, 62, 79, 0.6);
        }

        .vault-btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            color: #d4d4d8;
            background: transparent;
            border: 1px solid var(--vault-pd-border);
            border-radius: 10px;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .vault-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: #52525b;
        }

        .vault-btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, var(--vault-pd-accent) 0%, var(--vault-pd-accent-dim) 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: filter 0.15s ease, box-shadow 0.15s ease;
        }

        .vault-btn-primary:hover {
            filter: brightness(1.08);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.35);
        }

        .provider-unknown {
            font-size: 14px;
            color: var(--vault-pd-muted);
            line-height: 1.6;
        }

        .provider-unknown a { color: #c4b5fd; }
    </style>
</head>
<body class="models-page">
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div class="header"></div>

            <div class="provider-config-layout">
                <div class="provider-config-main">
                    <div class="provider-config-inner">
                        <nav class="vault-create-breadcrumb" aria-label="Breadcrumb">
                            <a href="index.html">Models</a>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
                            <span id="breadcrumbProvider">Configure provider</span>
                        </nav>

                        <div id="providerConfigContent"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const PROVIDERS = {
            openai: {
                name: 'OpenAI',
                lead: 'Paste an API key from the OpenAI dashboard. Project keys and legacy user keys are supported.',
                fields: [
                    { id: 'apiKey', label: 'API key', type: 'password', placeholder: 'sk-… or sk-proj-…', hint: 'Stored encrypted; not shown again after save.' }
                ]
            },
            anthropic: {
                name: 'Anthropic',
                lead: 'Use an API key from the Anthropic Console. Required for Claude models in agents and tools.',
                fields: [
                    { id: 'apiKey', label: 'API key', type: 'password', placeholder: 'sk-ant-api03-…', hint: 'Stored encrypted; not shown again after save.' }
                ]
            },
            google: {
                name: 'Google AI',
                lead: 'Provide a Google AI Studio API key, or path / JSON for a service account if you use Vertex AI.',
                fields: [
                    { id: 'apiKey', label: 'API key', type: 'password', placeholder: 'AIza…', hint: 'Optional if using service account below.' },
                    { id: 'serviceAccount', label: 'Service account (optional)', type: 'text', placeholder: 'Path or paste JSON', hint: 'For Vertex AI or workspace-restricted setups.' }
                ]
            },
            azure: {
                name: 'Azure OpenAI',
                lead: 'Set your Azure OpenAI resource endpoint and key from the Azure portal.',
                fields: [
                    { id: 'endpoint', label: 'Resource endpoint URL', type: 'url', placeholder: 'https://your-resource.openai.azure.com/', hint: '' },
                    { id: 'apiKey', label: 'API key', type: 'password', placeholder: 'Key from Azure portal', hint: 'Stored encrypted; not shown again after save.' }
                ]
            }
        };

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function renderUnknown(slug) {
            return '<p class="provider-unknown">Unknown provider <strong>' + escapeHtml(slug) + '</strong>. ' +
                '<a href="index.html">Back to Models</a></p>';
        }

        function renderForm(meta) {
            const fieldsHtml = meta.fields.map(function(f) {
                const hint = f.hint
                    ? '<span class="vault-field-hint" id="' + escapeHtml(f.id) + 'Hint">' + escapeHtml(f.hint) + '</span>'
                    : '';
                return '<div class="vault-field">' +
                    '<label for="' + escapeHtml(f.id) + '">' + escapeHtml(f.label) + hint + '</label>' +
                    '<input type="' + escapeHtml(f.type) + '" id="' + escapeHtml(f.id) + '" name="' + escapeHtml(f.id) + '" class="vault-input" placeholder="' + escapeHtml(f.placeholder) + '" autocomplete="off">' +
                    '</div>';
            }).join('');

            return '<h1 class="vault-create-title">Configure ' + escapeHtml(meta.name) + '</h1>' +
                '<p class="vault-create-lead">' + escapeHtml(meta.lead) + '</p>' +
                '<div class="vault-create-callout" role="note">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>' +
                '<div>This is a mock screen. Saving does not persist keys. In the product, credentials would be stored securely and connection status on the Models list would update after a successful test.</div>' +
                '</div>' +
                '<form class="vault-create-form" id="providerConfigForm">' +
                fieldsHtml +
                '<div class="vault-form-actions">' +
                '<a href="index.html" class="vault-btn-secondary">Cancel</a>' +
                '<button type="submit" class="vault-btn-primary">Save &amp; test connection</button>' +
                '</div></form>';
        }

        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const slug = (params.get('provider') || '').toLowerCase().trim();
            const root = document.getElementById('providerConfigContent');
            const crumb = document.getElementById('breadcrumbProvider');

            const meta = PROVIDERS[slug];
            if (!meta) {
                root.innerHTML = renderUnknown(slug || '(missing)');
                crumb.textContent = 'Configure provider';
                return;
            }

            crumb.textContent = meta.name;
            document.title = 'Kaiden · Configure ' + meta.name;
            root.innerHTML = renderForm(meta);

            document.getElementById('providerConfigForm').addEventListener('submit', function(e) {
                e.preventDefault();
                alert('Mock: credentials would be saved and connection tested. Returning to Models.');
                window.location.href = 'index.html';
            });
        });
    </script>
</body>
</html>
