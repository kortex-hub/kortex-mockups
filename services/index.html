<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaiden - Secret Vault</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <script src="../assets/js/demo-scenario.js"></script>
    <script src="../assets/js/demo-screen-data.js"></script>
    <script src="../assets/js/demo-page-hydrate.js"></script>
    <script src="../assets/js/sidebar-loader.js"></script>
    <style>
        /* Podman Extensions–style: title + action, underline search, category text tabs */
        :root {
            --vault-pd-accent: #8b5cf6;
            --vault-pd-accent-dim: #7c3aed;
            --vault-pd-border: #3d3e4f;
            --vault-pd-muted: #9ca3af;
        }

        .services-page-layout {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 32px);
            overflow: hidden;
        }

        .services-main {
            flex: 1;
            overflow-y: auto;
            padding: 28px 40px 40px;
            min-width: 0;
        }

        .services-main::-webkit-scrollbar { width: 6px; }
        .services-main::-webkit-scrollbar-track { background: transparent; }
        .services-main::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.2); border-radius: 3px; }

        /* Title row — title left, primary action right */
        .vault-pd-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 22px;
        }

        .vault-pd-title-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .services-title {
            font-size: 26px;
            font-weight: 700;
            color: #f4f4f5;
            letter-spacing: -0.02em;
            margin: 0;
            line-height: 1.15;
        }

        .vault-pd-subtitle {
            font-size: 13px;
            color: var(--vault-pd-muted);
        }

        .vault-pd-primary-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            background: linear-gradient(135deg, var(--vault-pd-accent) 0%, var(--vault-pd-accent-dim) 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: filter 0.15s ease, box-shadow 0.15s ease;
            flex-shrink: 0;
        }

        .vault-pd-primary-btn:hover {
            filter: brightness(1.08);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.35);
        }

        .vault-pd-primary-btn svg { width: 17px; height: 17px; }

        a.vault-pd-primary-btn {
            text-decoration: none;
            color: #fff;
            box-sizing: border-box;
        }

        /* Search — bottom border only (Podman Extensions pattern) */
        .vault-pd-search {
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 420px;
            padding: 10px 0 12px;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            transition: border-color 0.2s ease;
        }

        .vault-pd-search:focus-within {
            border-bottom-color: var(--vault-pd-accent);
        }

        .vault-pd-search svg {
            width: 17px;
            height: 17px;
            color: var(--vault-pd-muted);
            flex-shrink: 0;
        }

        .vault-pd-search input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            outline: none;
            color: #e5e7eb;
            font-size: 14px;
        }

        .vault-pd-search input::placeholder { color: #6b7280; }

        /* Category tabs — purple underline on active, full-width rule below */
        .vault-pd-tabs-strip {
            border-bottom: 1px solid var(--vault-pd-border);
            margin-bottom: 0;
        }

        .vault-pd-tabs {
            display: flex;
            align-items: stretch;
            flex-wrap: wrap;
            gap: 0;
        }

        .vault-pd-tab {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px 12px 0;
            margin-right: 8px;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 500;
            color: var(--vault-pd-muted);
            cursor: pointer;
            transition: color 0.15s ease;
        }

        .vault-pd-tab:hover { color: #e5e7eb; }

        .vault-pd-tab.active {
            color: #f4f4f5;
        }

        .vault-pd-tab.active::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: -1px;
            height: 3px;
            background: var(--vault-pd-accent);
            border-radius: 2px 2px 0 0;
        }

        #vaultMockList { display: contents; }

        .vault-empty-state {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 48px 24px;
            margin-top: 8px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--vault-pd-border);
            border-radius: 14px;
            color: var(--vault-pd-muted);
        }

        .vault-empty-state svg {
            width: 40px;
            height: 40px;
            color: #4b5563;
            margin-bottom: 14px;
        }

        .vault-empty-state h2 {
            font-size: 15px;
            font-weight: 600;
            color: #e5e7eb;
            margin: 0 0 6px 0;
        }

        .vault-empty-state p {
            font-size: 13px;
            line-height: 1.5;
            margin: 0;
            max-width: 360px;
        }

        /* ── Service List ── */
        .services-grid {
            display: flex;
            flex-direction: column;
            margin-top: 8px;
        }

        .service-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(61, 62, 79, 0.4);
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .service-card:last-child {
            border-bottom: none;
        }

        .service-card:hover {
            background: rgba(139, 92, 246, 0.06);
        }

        a.service-card {
            text-decoration: none;
            color: inherit;
            box-sizing: border-box;
        }

        a.service-card:focus-visible {
            outline: 2px solid var(--vault-pd-accent);
            outline-offset: 2px;
        }

        .service-card-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .service-card-icon svg { width: 17px; height: 17px; }
        .service-card-icon.llm { background: rgba(139, 92, 246, 0.1); border: 1px solid rgba(139, 92, 246, 0.15); }
        .service-card-icon.llm svg { color: #a78bfa; }
        .service-card-icon.api { background: rgba(6, 182, 212, 0.1); border: 1px solid rgba(6, 182, 212, 0.15); }
        .service-card-icon.api svg { color: #22d3ee; }
        .service-card-icon.infra { background: rgba(249, 115, 22, 0.1); border: 1px solid rgba(249, 115, 22, 0.15); }
        .service-card-icon.infra svg { color: #fb923c; }

        .service-card-info {
            flex: 1;
            min-width: 0;
        }

        .service-card-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .service-card-title { font-size: 14px; font-weight: 600; color: #e5e7eb; }

        .service-type-badge {
            font-size: 9px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .service-type-badge.llm { background: rgba(139, 92, 246, 0.15); color: #c4b5fd; }
        .service-type-badge.api { background: rgba(6, 182, 212, 0.15); color: #67e8f9; }
        .service-type-badge.infra { background: rgba(249, 115, 22, 0.15); color: #fdba74; }

        .service-card-desc {
            font-size: 12px;
            color: #6b7280;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .service-card-token { display: none; }
        .service-card-consumers { display: none; }
        .service-card-badges { display: none; }
        .service-card-header { display: none; }

        .service-card-meta {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #6b7280;
            white-space: nowrap;
            width: 80px;
            justify-content: flex-end;
        }

        .service-card-meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .service-card-meta-item svg { width: 12px; height: 12px; }

        .service-card-footer {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            margin-left: auto;
        }

        .service-card-status {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            white-space: nowrap;
            min-width: 64px;
            text-align: center;
        }

        .service-card-status.active {
            background: rgba(52, 211, 153, 0.12);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .service-card-status.expired {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .service-card-status.warning {
            background: rgba(245, 158, 11, 0.12);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .service-card-status.inactive {
            background: rgba(107, 114, 128, 0.12);
            color: #9ca3af;
            border: 1px solid rgba(107, 114, 128, 0.2);
        }

        .services-section-header {
            font-size: 11px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 14px 16px 6px;
            margin-top: 4px;
            border-top: 1px solid rgba(61, 62, 79, 0.4);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .services-section-header:first-child {
            border-top: none;
            margin-top: 0;
            padding-top: 4px;
        }
    </style>
</head>
<body class="services-page">
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div class="header"></div>

            <div class="services-page-layout">
                <div class="services-main">
                    <div class="vault-pd-title-row">
                        <div class="vault-pd-title-block">
                            <h1 class="services-title">Secret Vault</h1>
                            <p class="vault-pd-subtitle" id="vaultSubtitle">6 credentials · tokens and platform keys</p>
                        </div>
                        <a href="create.html" class="vault-pd-primary-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            Add Secret
                        </a>
                    </div>

                    <div class="vault-pd-search" role="search">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="search" id="vaultSearchInput" placeholder="Search..." autocomplete="off" aria-label="Search credentials">
                    </div>

                    <div class="vault-pd-tabs-strip">
                        <nav class="vault-pd-tabs" aria-label="Credential categories">
                            <button type="button" class="vault-pd-tab active" data-category="all" onclick="filterVaultCategory('all', this)">All secrets</button>
                            <button type="button" class="vault-pd-tab" data-category="api" onclick="filterVaultCategory('api', this)">API tokens</button>
                            <button type="button" class="vault-pd-tab" data-category="infra" onclick="filterVaultCategory('infra', this)">Infrastructure</button>
                        </nav>
                    </div>

                    <!-- Credential list -->
                    <div class="services-grid" id="servicesGrid">

                        <div class="vault-empty-state" id="vaultEmptyState" aria-live="polite">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M12 11V7a4 4 0 0 0-4-4H8"/><circle cx="12" cy="16" r="1" fill="currentColor" stroke="none"/></svg>
                            <h2>No secrets yet</h2>
                            <p>Your vault is empty after setup. Add API tokens, OAuth connections, and infrastructure credentials when you connect tools or projects.</p>
                        </div>

                        <div id="vaultMockList"></div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        function getActiveVaultCategory() {
            const tab = document.querySelector('.vault-pd-tab.active');
            return tab ? tab.getAttribute('data-category') || 'all' : 'all';
        }

        function applyVaultListVisibility() {
            if (document.body.getAttribute('data-demo-vault-mode') === 'empty') return;
            const grid = document.getElementById('servicesGrid');
            const input = document.getElementById('vaultSearchInput');
            if (!grid) return;
            const q = input ? (input.value || '').trim().toLowerCase() : '';
            const cat = getActiveVaultCategory();

            const cards = grid.querySelectorAll('.service-card');
            const headers = grid.querySelectorAll('.services-section-header');

            cards.forEach(card => {
                const typeOk = cat === 'all' || card.dataset.type === cat;
                const textOk = !q || card.textContent.toLowerCase().includes(q);
                card.style.display = typeOk && textOk ? '' : 'none';
            });

            headers.forEach(h => {
                const headerTypeOk = cat === 'all' || h.dataset.type === cat;
                if (!headerTypeOk) {
                    h.style.display = 'none';
                    return;
                }
                let next = h.nextElementSibling;
                let any = false;
                while (next && next.classList.contains('service-card')) {
                    if (next.style.display !== 'none') any = true;
                    next = next.nextElementSibling;
                }
                h.style.display = any ? 'flex' : 'none';
            });
        }

        function filterVaultCategory(cat, el) {
            document.querySelectorAll('.vault-pd-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            applyVaultListVisibility();
        }

        document.addEventListener('DOMContentLoaded', function() {
            const input = document.getElementById('vaultSearchInput');
            if (input) input.addEventListener('input', applyVaultListVisibility);
        });
    </script>
</body>
</html>
