<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kortex - Agent Feed</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <script src="../assets/js/sidebar-loader.js"></script>
    <style>
        .agent-feed-page-layout {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 28px);
            overflow: hidden;
        }

        .agent-feed-page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 40px 16px;
            border-bottom: 1px solid #2d2e3f;
            flex-shrink: 0;
        }

        .agent-feed-page-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .agent-feed-page-icon {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(139, 92, 246, 0.12);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 10px;
        }

        .agent-feed-page-icon svg {
            width: 20px;
            height: 20px;
            color: #c4b5fd;
        }

        .agent-feed-page-title {
            font-size: 22px;
            font-weight: 700;
            color: #e5e7eb;
            letter-spacing: -0.02em;
        }

        .agent-feed-page-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(52, 211, 153, 0.12);
            border: 1px solid rgba(52, 211, 153, 0.25);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #34d399;
        }

        .agent-feed-page-badge .page-badge-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #34d399;
            animation: pulse-green 2s infinite;
        }

        .agent-feed-page-tabs {
            display: flex;
            gap: 2px;
            padding: 0 40px;
            border-bottom: 1px solid #2d2e3f;
            flex-shrink: 0;
        }

        .agent-feed-page-tabs .agent-feed-tab {
            padding: 12px 18px;
            font-size: 13px;
            font-weight: 500;
            color: #6b7280;
            cursor: pointer;
            border: none;
            background: none;
            border-bottom: 2px solid transparent;
            transition: all 0.15s ease;
        }

        .agent-feed-page-tabs .agent-feed-tab:hover {
            color: #9ca3af;
        }

        .agent-feed-page-tabs .agent-feed-tab.active {
            color: #c4b5fd;
            border-bottom-color: #8b5cf6;
        }

        .agent-feed-page-stream {
            flex: 1;
            overflow-y: auto;
            padding: 20px 40px;
        }

        .agent-feed-page-stream::-webkit-scrollbar {
            width: 6px;
        }

        .agent-feed-page-stream::-webkit-scrollbar-track {
            background: transparent;
        }

        .agent-feed-page-stream::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.2);
            border-radius: 3px;
        }

        .agent-feed-page-stream .feed-card {
            max-width: 960px;
        }

        /* ── Live Monitoring Button ── */
        .af-live-monitor-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 9px;
            color: #6ee7b7;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .af-live-monitor-btn:hover {
            background: rgba(16, 185, 129, 0.14);
            border-color: rgba(16, 185, 129, 0.35);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.15);
        }
        .af-live-monitor-btn.active {
            background: rgba(16, 185, 129, 0.16);
            border-color: rgba(16, 185, 129, 0.4);
        }
        .af-live-monitor-btn .af-lm-pulse {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 6px rgba(16, 185, 129, 0.5);
            animation: af-lm-pulse 2s ease-in-out infinite;
        }
        @keyframes af-lm-pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 6px rgba(16, 185, 129, 0.5); }
            50%       { opacity: 0.4; box-shadow: 0 0 2px rgba(16, 185, 129, 0.2); }
        }
        .af-live-monitor-btn .af-lm-label { white-space: nowrap; }

        /* ── Feed card transition animation ── */
        .feed-card.af-updating {
            animation: af-card-flash 0.6s ease-out;
        }
        @keyframes af-card-flash {
            0%   { opacity: 0.3; transform: scale(0.98); }
            100% { opacity: 1;   transform: scale(1); }
        }
    </style>
</head>
<body class="agent-feed-page">
    <div class="app-container">
        <div id="sidebar-container"></div>

        <div class="agent-feed-page-layout">
            <div class="agent-feed-page-header">
                <div class="agent-feed-page-header-left">
                    <div class="agent-feed-page-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 11a9 9 0 0 1 9 9"/>
                            <path d="M4 4a16 16 0 0 1 16 16"/>
                            <circle cx="5" cy="19" r="1"/>
                        </svg>
                    </div>
                    <h1 class="agent-feed-page-title">Agent Feed</h1>
                    <div class="agent-feed-page-badge">
                        <div class="page-badge-dot"></div>
                        <span id="pageFeedBadge">loading...</span>
                    </div>
                </div>
                <button class="af-live-monitor-btn" id="afLiveMonitorBtn" onclick="toggleAfLiveMonitor()">
                    <span class="af-lm-pulse"></span>
                    <span class="af-lm-label">Live Monitoring</span>
                </button>
            </div>

            <div class="agent-feed-page-tabs">
                <button class="agent-feed-tab active" data-feed-tab="all" onclick="window.agentFeedPage.filterTab('all', this)">All Activity</button>
                <button class="agent-feed-tab" data-feed-tab="needs-input" onclick="window.agentFeedPage.filterTab('needs-input', this)">Needs Input</button>
                <button class="agent-feed-tab" data-feed-tab="running" onclick="window.agentFeedPage.filterTab('running', this)">Running</button>
                <button class="agent-feed-tab" data-feed-tab="completed" onclick="window.agentFeedPage.filterTab('completed', this)">Completed</button>
            </div>

            <div class="agent-feed-page-stream" id="agentFeedPageStream"></div>
        </div>
    </div>

    <script src="../assets/js/agent-feed.js"></script>
    <script>
        var afLmInterval = null;
        var afLmRunning = false;

        function toggleAfLiveMonitor() {
            var btn = document.getElementById('afLiveMonitorBtn');
            if (afLmRunning) {
                stopAfLiveMonitor();
                btn.classList.remove('active');
                btn.querySelector('.af-lm-label').textContent = 'Live Monitoring';
            } else {
                startAfLiveMonitor();
                btn.classList.add('active');
                btn.querySelector('.af-lm-label').textContent = 'Monitoring\u2026';
            }
            afLmRunning = !afLmRunning;
        }

        function stopAfLiveMonitor() {
            if (afLmInterval) { clearInterval(afLmInterval); afLmInterval = null; }
        }

        function getActiveTab() {
            var active = document.querySelector('.agent-feed-page-tabs .agent-feed-tab.active');
            return active ? active.getAttribute('data-feed-tab') : 'all';
        }

        function reRenderFeed() {
            var stream = document.getElementById('agentFeedPageStream');
            var badge = document.getElementById('pageFeedBadge');
            window.agentFeed._renderInto(stream, badge, getActiveTab());
            stream.querySelectorAll('.feed-card').forEach(function (c) {
                c.classList.add('af-updating');
                setTimeout(function () { c.classList.remove('af-updating'); }, 650);
            });
        }

        function startAfLiveMonitor() {
            if (afLmInterval) clearInterval(afLmInterval);
            var step = 0;
            var events = [
                function () {
                    window.agentFeed.updateAgent('add-dark-mode', {
                        status: 'waiting', statusLabel: 'Waiting for input', time: 'now',
                        activity: null,
                        question: {
                            text: 'I\'ve implemented the dark mode toggle. The theme applies globally via a CSS class on <code>&lt;body&gt;</code>. Should I also persist the preference to <code>localStorage</code>, or use a server-side setting?',
                            options: [
                                { label: 'Use localStorage', type: 'primary' },
                                { label: 'Server-side setting', type: 'secondary' }
                            ],
                            allowReply: true
                        }
                    });
                    reRenderFeed();
                },
                function () {
                    window.agentFeed.updateAgent('fix-memory-leak', {
                        status: 'running', statusLabel: 'Running', time: 'now',
                        progress: 60, progressSteps: '3 / 4',
                        activity: { text: 'Refactoring AsyncPool connection handling', type: 'writing' },
                        question: null
                    });
                    reRenderFeed();
                },
                function () {
                    window.agentFeed.updateAgent('api-docs', {
                        status: 'running', statusLabel: 'Running', time: 'now',
                        activity: { text: 'Scanning route definitions in src/routes/', type: 'reading' },
                        question: null
                    });
                    reRenderFeed();
                },
                function () {
                    window.agentFeed.updateAgent('refactor-auth', {
                        status: 'running', statusLabel: 'Running', time: 'now',
                        progress: 70, progressSteps: '4 / 5',
                        activity: { text: 'Writing JWT verification middleware', type: 'writing' },
                        question: null
                    });
                    reRenderFeed();
                },
                function () {
                    window.agentFeed.updateAgent('fix-memory-leak', {
                        status: 'completed', statusLabel: 'Completed', time: 'just now',
                        progress: 100, progressSteps: '4 / 4',
                        activity: null, question: null
                    });
                    reRenderFeed();
                },
                function () {
                    window.agentFeed.updateAgent('add-dark-mode', {
                        status: 'running', statusLabel: 'Running', time: 'now',
                        progress: 55, progressSteps: '2 / 4',
                        activity: { text: 'Adding localStorage persistence for theme', type: 'writing' },
                        question: null
                    });
                    reRenderFeed();
                }
            ];
            afLmInterval = setInterval(function () {
                if (step < events.length) {
                    events[step]();
                    step++;
                } else {
                    clearInterval(afLmInterval);
                    afLmInterval = null;
                }
            }, 3500);
        }

        document.addEventListener('DOMContentLoaded', function () {
            function waitForFeed(cb, tries) {
                if (window.agentFeed && window.agentFeed._renderInto) { cb(); return; }
                if (tries > 20) return;
                setTimeout(function () { waitForFeed(cb, (tries || 0) + 1); }, 50);
            }
            waitForFeed(function () {
                var stream = document.getElementById('agentFeedPageStream');
                var badge = document.getElementById('pageFeedBadge');

                window.agentFeedPage = {
                    filterTab: function (tab, btn) {
                        document.querySelectorAll('.agent-feed-page-tabs .agent-feed-tab').forEach(function (t) { t.classList.remove('active'); });
                        btn.classList.add('active');
                        window.agentFeed._renderInto(stream, badge, tab);
                    }
                };

                window.agentFeed._renderInto(stream, badge, 'all');
            });
        });
    </script>
</body>
</html>
