<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kortex - Agentic Workspaces</title>
        <script src="../assets/js/kaiden-theme.js"></script>
<link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/models-catalog-table.css">
    <script src="../assets/js/sidebar-loader.js"></script>
    <script src="../assets/js/page-data.js"></script>
    <style>
        /* Sessions page — workspace dashboard */
        /* Match Secret Vault (services/index): full-width main, left-aligned — no max-width / centering */
        body.sessions-page .content {
            padding: 28px 40px 40px;
            min-width: 0;
            box-sizing: border-box;
        }

        /**
         * Boxed surfaces (stats, search, list): light = card + border + soft shadow so they
         * stay distinct on the page; dark = flat gradient panels (original look).
         */
        body.sessions-page {
            --sess-stat-bg: linear-gradient(180deg, var(--kd-bg-card) 0%, color-mix(in srgb, var(--kd-bg-subtle) 50%, var(--kd-bg-card)) 100%);
            --sess-stat-shadow: 0 1px 2px rgba(13, 27, 46, 0.06), 0 8px 24px rgba(13, 27, 46, 0.08);
            --sess-list-bg: linear-gradient(180deg, var(--kd-bg-card) 0%, color-mix(in srgb, var(--kd-bg-subtle) 55%, var(--kd-bg-card)) 100%);
            --sess-list-shadow: 0 1px 2px rgba(13, 27, 46, 0.06), 0 12px 32px rgba(13, 27, 46, 0.09);
            --sess-search-bg: var(--kd-bg-card);
            --sess-search-shadow: 0 1px 2px rgba(13, 27, 46, 0.05), 0 6px 18px rgba(13, 27, 46, 0.07);
            --sess-cli-bg: var(--kd-bg-card);
            --sess-cli-fg: var(--kd-text-primary);
            --sess-cli-border: var(--kd-border);
            --sess-cli-hover-bg: var(--kd-bg-subtle);
            --sess-cli-hover-border: var(--kd-text-muted);
            --sess-dropdown-bg: var(--kd-bg-card);
            --sess-dropdown-shadow: 0 12px 40px rgba(13, 27, 46, 0.12), 0 4px 12px rgba(13, 27, 46, 0.06);
        }

        html.dark body.sessions-page {
            --sess-stat-bg: linear-gradient(160deg, #111e33 0%, #1c1d26 100%);
            --sess-stat-shadow: none;
            --sess-list-bg: #060c18;
            --sess-list-shadow: none;
            --sess-search-bg: #111827;
            --sess-search-shadow: none;
            --sess-cli-bg: #2a2b36;
            --sess-cli-fg: var(--kd-text-primary);
            --sess-cli-border: var(--kd-surface-muted);
            --sess-cli-hover-bg: #32333f;
            --sess-cli-hover-border: #6b7280;
            --sess-dropdown-bg: linear-gradient(165deg, #2a2b36 0%, #1f2028 100%);
            --sess-dropdown-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
        }

        body.sessions-page .rag-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--kd-text-primary);
        }

        .sessions-page-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .create-cli-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 18px;
            background: var(--sess-cli-bg);
            color: var(--sess-cli-fg);
            border: 1px solid var(--sess-cli-border);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 1px 2px rgba(13, 27, 46, 0.05);
        }

        html:not(.dark) .create-cli-btn {
            box-shadow: 0 1px 2px rgba(13, 27, 46, 0.06), 0 4px 12px rgba(13, 27, 46, 0.05);
        }

        .create-cli-btn:hover {
            background: var(--sess-cli-hover-bg);
            border-color: var(--sess-cli-hover-border);
        }

        body.sessions-page .vault-pd-search {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0 12px;
            margin-bottom: 6px;
            border-bottom: 1px solid var(--kd-border);
            transition: border-color 0.2s ease;
        }

        body.sessions-page .vault-pd-search:focus-within {
            border-bottom-color: var(--kd-accent);
        }

        body.sessions-page .vault-pd-search svg {
            width: 17px;
            height: 17px;
            color: var(--kd-text-muted);
            flex-shrink: 0;
        }

        body.sessions-page .vault-pd-search input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            outline: none;
            color: var(--kd-text-primary);
            font-size: 14px;
        }

        body.sessions-page .vault-pd-search input::placeholder {
            color: var(--kd-text-muted);
        }

        .sessions-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 20px;
            padding: 0;
            background: transparent;
            border: none;
        }

        @media (max-width: 480px) {
            .sessions-stats {
                grid-template-columns: 1fr;
            }
        }

        .stat-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 20px;
            background: var(--sess-stat-bg);
            border: 1px solid var(--kd-border);
            border-radius: 12px;
            box-shadow: var(--sess-stat-shadow);
        }

        .sessions-list {
            --sess-col-icon: 44px;
            --sess-col-context: 60px;
            --sess-col-runtime: 110px;
            --sess-col-time: 80px;
            --sess-col-actions: 108px;
            --sess-col-gap: 20px;
            margin-top: 0;
            background: var(--sess-list-bg);
            border: 1px solid var(--kd-border);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: var(--sess-list-shadow);
        }

        /* Secret Vault–style column labels (same grid as rows). */
        .sessions-column-header {
            display: grid;
            grid-template-columns: var(--sess-col-icon) minmax(0, 1fr) var(--sess-col-context) var(--sess-col-runtime) var(--sess-col-time) var(--sess-col-actions);
            column-gap: var(--sess-col-gap);
            padding: 12px 22px 10px;
            align-items: end;
            font-size: 11px;
            font-weight: 600;
            color: var(--kd-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            background: #060c18;
            border-bottom: 1px solid var(--kd-border);
        }

        .sessions-column-header .sessions-col-h-spacer {
            grid-column: 1;
        }

        .sessions-column-header .sessions-col-h-label {
            min-width: 0;
        }

        .sessions-column-header .sessions-col-h-label--time {
            text-align: right;
        }

        .sessions-section-header {
            padding: 16px 22px 10px;
            font-size: 10px;
            font-weight: 700;
            color: var(--kd-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            background: color-mix(in srgb, var(--kd-text-primary) 4%, var(--kd-bg-card));
        }

        .sessions-section-header + .session-row {
            border-top: none;
        }

        /* Vault-like row: icon | workspace (1fr) | fixed context | fixed runtime | fixed time | actions — grid areas keep columns aligned. */
        .session-row {
            display: grid;
            grid-template-columns: var(--sess-col-icon) minmax(0, 1fr) var(--sess-col-context) var(--sess-col-runtime) var(--sess-col-time) var(--sess-col-actions);
            grid-template-areas: "sess-icon sess-body sess-ctx sess-runtime sess-time sess-act";
            grid-template-rows: auto;
            column-gap: var(--sess-col-gap);
            row-gap: 0;
            padding: 12px 22px;
            cursor: pointer;
            transition: background 0.15s ease;
            background: #1c2d47;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            position: relative;
            align-items: center;
        }

        .session-row:last-child {
            border-bottom: none;
        }

        .session-row:hover {
            background: #213352;
        }

        .session-row-progress {
            grid-area: sess-prog;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
            width: 100%;
            position: relative;
            cursor: default;
        }

        .session-row-progress-bar {
            height: 5px;
            width: 100%;
            min-width: 0;
            background: rgba(107, 114, 128, 0.22);
            border-radius: 3px;
            overflow: hidden;
        }

        .session-row-progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.2s ease;
        }

        .session-row-progress-fill.low {
            background: #34d399;
        }

        .session-row-progress-fill.medium {
            background: #fbbf24;
        }

        .session-row-progress-fill.high {
            background: #f87171;
        }

        .session-row-progress-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 500;
            color: var(--kd-text-muted);
            flex-wrap: nowrap;
            min-width: 0;
        }

        .session-row-progress-meta .meta-pct {
            font-variant-numeric: tabular-nums;
            color: var(--kd-text-secondary);
        }

        .session-row-progress-meta .meta-sep {
            color: var(--kd-surface-muted);
            user-select: none;
        }

        .session-row-progress-meta .session-row-status-label.running {
            color: #34d399;
        }

        .session-row-progress-meta .session-row-status-label.stopped {
            color: var(--kd-text-muted);
        }

        @media (max-width: 680px) {
            .sessions-column-header {
                display: none;
            }

            .session-row-runtime,
            .session-row-context {
                display: none;
            }

            .session-row {
                grid-template-columns: 40px minmax(0, 1fr) 52px 96px;
                grid-template-areas: "sess-icon sess-body sess-time sess-act";
                column-gap: 10px;
                row-gap: 0;
                align-items: center;
            }

            .session-row-actions {
                margin-top: 0;
            }

            .session-row-title {
                white-space: normal;
            }
        }

        .session-row-icon {
            grid-area: sess-icon;
            align-self: center;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .session-row-icon.claude {
            background: linear-gradient(135deg, #d97706, #f59e0b);
            color: #ffffff;
        }

        .session-row-icon.codex {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: #ffffff;
        }

        .session-row-icon.opencode {
            background: linear-gradient(135deg, #374151, #1f2937);
            color: #9ca3af;
            font-size: 11px;
            letter-spacing: -0.03em;
        }

        html.dark .session-row-icon.opencode {
            background: #1f2937;
            color: #6b7280;
        }

        .session-row-body {
            grid-area: sess-body;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .session-row-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--kd-text-primary);
            line-height: 1.35;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            overflow: hidden;
        }

        .session-row-subtitle {
            font-size: 12px;
            color: var(--kd-text-muted);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            overflow: hidden;
        }

        .session-row:hover .session-row-subtitle {
            color: var(--kd-accent-dim);
        }

        .session-row-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .session-row-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            border: 1px solid transparent;
            box-sizing: border-box;
        }

        .session-row-tag svg {
            width: 12px;
            height: 12px;
        }

        /* Light: strong text + slightly richer fill so pills read on white cards */
        .session-row-tag.mcp {
            background: color-mix(in srgb, var(--kd-accent) 18%, var(--kd-bg-subtle));
            color: var(--kd-accent-dim);
            border-color: color-mix(in srgb, var(--kd-accent) 42%, var(--kd-border));
        }

        .session-row-tag.skill {
            background: color-mix(in srgb, #059669 14%, var(--kd-bg-subtle));
            color: #047857;
            border-color: color-mix(in srgb, #059669 32%, var(--kd-border));
        }

        .session-row-tag.tool {
            background: color-mix(in srgb, #be185d 12%, var(--kd-bg-subtle));
            color: #9d174d;
            border-color: color-mix(in srgb, #be185d 28%, var(--kd-border));
        }

        html.dark .session-row-tag.mcp {
            background: rgba(6, 182, 212, 0.1);
            color: #67e8f9;
            border-color: transparent;
        }

        html.dark .session-row-tag.skill {
            background: rgba(16, 185, 129, 0.1);
            color: #6ee7b7;
            border-color: transparent;
        }

        html.dark .session-row-tag.tool {
            background: rgba(236, 72, 153, 0.1);
            color: #f9a8d4;
            border-color: transparent;
        }

        .session-row-context-tooltip {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--kd-bg);
            border: 1px solid var(--kd-border);
            border-radius: 8px;
            padding: 8px 12px;
            white-space: nowrap;
            font-size: 12px;
            color: var(--kd-text-primary);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        .session-row-context-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: var(--kd-border);
        }

        .session-row-progress:hover .session-row-context-tooltip {
            opacity: 1;
        }

        .session-row-context-tooltip .tooltip-label {
            font-size: 10px;
            color: var(--kd-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .session-row-context-tooltip .tooltip-value {
            font-weight: 600;
            color: var(--kd-text-primary);
        }

        .session-row-status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }

        .session-row-status-dot.running {
            background: #34d399;
            animation: pulse 2s infinite;
        }

        .session-row-status-dot.stopped {
            background: var(--kd-text-muted);
        }

        .session-row-status-label {
            font-size: 12px;
            font-weight: 500;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.4); }
            50% { opacity: 0.8; box-shadow: 0 0 0 4px rgba(52, 211, 153, 0); }
        }

        .session-row-time {
            grid-area: sess-time;
            justify-self: start;
            font-size: 12px;
            color: var(--kd-text-muted);
            font-weight: 600;
            min-width: 0;
            text-align: right;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        .session-row:hover .session-row-time {
            color: var(--kd-text-secondary);
        }

        .session-row-actions {
            grid-area: sess-act;
            justify-self: end;
            display: flex;
            gap: 4px;
            flex-shrink: 0;
            opacity: 1;
        }

        .session-row-action {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .session-row-action.stop {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
        }

        .session-row-action.stop:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        .session-row-action.play {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
        }

        .session-row-action.play:hover {
            background: rgba(16, 185, 129, 0.3);
        }

        .session-row-action.open {
            background: rgba(79, 195, 247, 0.12);
            color: #6dd6ff;
        }

        .session-row-action.open:hover {
            background: rgba(79, 195, 247, 0.25);
        }

        .session-row-action.terminal {
            background: rgba(107, 114, 128, 0.12);
            color: var(--kd-text-secondary);
        }

        .session-row-action.terminal:hover {
            background: rgba(107, 114, 128, 0.25);
            color: var(--kd-text-primary);
        }

        .session-row-action.delete {
            background: rgba(239, 68, 68, 0.08);
            color: #f87171;
        }

        .session-row-action.delete:hover {
            background: rgba(239, 68, 68, 0.22);
        }

        /* Agent type badge shown below workspace name */
        .session-row-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .session-agent-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        .session-agent-badge.opencode {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
        }

        .session-agent-badge.claude-code {
            background: rgba(217, 119, 6, 0.15);
            color: #fbbf24;
        }

        .session-agent-badge.codex {
            background: rgba(14, 165, 233, 0.15);
            color: #38bdf8;
        }

        /* Context cell — simple "—" */
        .session-row-context {
            grid-area: sess-ctx;
            font-size: 13px;
            color: var(--kd-text-muted);
            align-self: center;
        }

        /* Runtime cell */
        .session-row-runtime {
            grid-area: sess-runtime;
            font-size: 12px;
            font-weight: 500;
            color: var(--kd-text-secondary);
            align-self: center;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-icon.active {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
        }

        .stat-icon.total {
            background: rgba(79, 195, 247, 0.15);
            color: #6dd6ff;
        }

        .stat-icon.agents {
            background: rgba(6, 182, 212, 0.15);
            color: #67e8f9;
        }

        .stat-info {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--kd-text-primary);
        }

        .stat-label {
            font-size: 12px;
            color: var(--kd-text-muted);
        }

        .create-session-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 20px;
            border-radius: 10px;
            font-size: 14px;
            background: var(--kd-accent);
            color: var(--kd-on-accent);
            border: none;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(79, 195, 247, 0.28);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .create-session-btn:hover {
            transform: translateY(-1px);
            background: var(--kd-accent-dim);
            box-shadow: 0 6px 20px rgba(79, 195, 247, 0.38);
        }

        .sessions-new-workspace-dropdown {
            position: relative;
            display: inline-block;
        }

        .sessions-new-workspace-dropdown > summary {
            list-style: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 16px 11px 20px;
            border-radius: 10px;
            font-size: 14px;
            background: var(--kd-accent);
            color: var(--kd-on-accent);
            border: none;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(79, 195, 247, 0.28);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .sessions-new-workspace-dropdown > summary::-webkit-details-marker {
            display: none;
        }

        .sessions-new-workspace-dropdown > summary:hover {
            background: var(--kd-accent-dim);
        }

        .sessions-new-workspace-dropdown[open] > summary {
            transform: translateY(-1px);
            background: var(--kd-accent-dim);
            box-shadow: 0 6px 20px rgba(79, 195, 247, 0.38);
        }

        .sessions-new-workspace-summary__chev {
            flex-shrink: 0;
            opacity: 0.92;
            transition: transform 0.2s ease;
        }

        .sessions-new-workspace-dropdown[open] .sessions-new-workspace-summary__chev {
            transform: rotate(180deg);
        }

        .sessions-new-workspace-panel {
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            min-width: 288px;
            max-width: min(360px, calc(100vw - 48px));
            padding: 6px;
            background: var(--sess-dropdown-bg);
            border: 1px solid var(--kd-border);
            border-radius: 12px;
            box-shadow: var(--sess-dropdown-shadow);
            z-index: 40;
        }

        .sessions-new-workspace-item {
            display: block;
            padding: 11px 12px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--kd-text-primary);
            transition: background 0.12s ease;
        }

        .sessions-new-workspace-item:hover {
            background: rgba(79, 195, 247, 0.12);
        }

        .sessions-new-workspace-item__title {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .sessions-new-workspace-item__desc {
            display: block;
            font-size: 11px;
            line-height: 1.45;
            color: var(--kd-text-muted);
            font-weight: 400;
        }

        .sessions-empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 56px 28px;
            color: var(--kd-text-muted);
        }

        .sessions-empty-state svg {
            width: 44px;
            height: 44px;
            color: var(--kd-surface-muted);
            margin-bottom: 16px;
        }

        .sessions-empty-state__title {
            font-size: 16px;
            font-weight: 600;
            color: var(--kd-text-primary);
            margin: 0 0 8px 0;
        }

        .sessions-empty-state__text {
            margin: 0;
            font-size: 13px;
            line-height: 1.55;
            max-width: 420px;
        }

        /* ── Titlebar ──────────────────────────────────────────── */
        body.sessions-page .header {
            height: 44px;
            min-height: 44px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 0;
            padding: 0;
            background: var(--kd-bg-card);
            border-bottom: 1px solid var(--kd-border);
            justify-content: flex-start;
        }

        .titlebar-traffic-lights {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 0 16px;
            flex-shrink: 0;
        }

        .titlebar-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .titlebar-dot-close  { background: #ff5f57; }
        .titlebar-dot-min    { background: #febc2e; }
        .titlebar-dot-max    { background: #28c840; }

        .titlebar-nav {
            display: flex;
            align-items: center;
            gap: 2px;
            padding-right: 12px;
            flex-shrink: 0;
        }

        .titlebar-nav-btn {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            border-radius: 6px;
            color: var(--kd-text-muted);
            cursor: pointer;
            transition: background 0.12s, color 0.12s;
        }

        .titlebar-nav-btn:hover:not(:disabled) {
            background: color-mix(in srgb, var(--kd-accent) 12%, transparent);
            color: var(--kd-text-primary);
        }

        .titlebar-nav-btn:disabled {
            opacity: 0.3;
            cursor: default;
        }

        .titlebar-search {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .titlebar-search-inner {
            display: flex;
            align-items: center;
            gap: 7px;
            background: color-mix(in srgb, var(--kd-text-primary) 5%, transparent);
            border: 1px solid var(--kd-border);
            border-radius: 7px;
            padding: 5px 12px;
            width: min(240px, 100%);
            cursor: text;
        }

        html.dark .titlebar-search-inner {
            background: rgba(255,255,255,0.04);
        }

        .titlebar-search-inner svg {
            color: var(--kd-text-muted);
            flex-shrink: 0;
        }

        .titlebar-search-inner span {
            font-size: 13px;
            color: var(--kd-text-muted);
            user-select: none;
        }

        /* Status dot in table */
        .sess-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            vertical-align: middle;
        }
        .sess-status-dot.running {
            background: #34d399;
            box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.2);
            animation: pulse 2s infinite;
        }
        .sess-status-dot.stopped {
            background: var(--kd-text-muted);
            opacity: 0.5;
        }

        /* Agent badge in table cell */
        .sess-agent-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 7px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 3px;
        }
        .sess-agent-badge.claude-code { background: rgba(217,119,6,0.15); color: #fbbf24; }
        .sess-agent-badge.codex       { background: rgba(14,165,233,0.15); color: #38bdf8; }
        .sess-agent-badge.opencode    { background: rgba(16,185,129,0.15); color: #34d399; }

        /* Action buttons reuse models-table-icon-btn; tint variants */
        .models-table-icon-btn.sess-stop   { color: #f87171; }
        .models-table-icon-btn.sess-stop:hover { background: rgba(239,68,68,0.18); border-color: transparent; color: #f87171; }
        .models-table-icon-btn.sess-play   { color: #34d399; }
        .models-table-icon-btn.sess-play:hover { background: rgba(16,185,129,0.18); border-color: transparent; color: #34d399; }
        .models-table-icon-btn.sess-del    { color: var(--kd-text-muted); }
        .models-table-icon-btn.sess-del:hover  { background: rgba(239,68,68,0.14); border-color: transparent; color: #f87171; }
    </style>
</head>
<body class="sessions-page">
    <div class="app-container">
        <!-- Sidebar will be loaded here -->
        <div id="sidebar-container"></div>

        <!-- Sessions UI -->
        <main class="main-content">
            <div class="content">
                <div class="rag-header">
                    <h2 class="rag-title">Agentic Workspaces</h2>
                    <div class="sessions-page-actions">
                        <button type="button" class="create-session-btn" onclick="window.location.href='create.html'">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <line x1="12" y1="5" x2="12" y2="19"/>
                                <line x1="5" y1="12" x2="19" y2="12"/>
                            </svg>
                            Create Workspace
                        </button>
                    </div>
                </div>

                <div class="sessions-stats">
                    <div class="stat-card">
                        <div class="stat-icon active">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/>
                                <polygon points="10 8 16 12 10 16 10 8" fill="currentColor"/>
                            </svg>
                        </div>
                        <div class="stat-info">
                            <span class="stat-value">4</span>
                            <span class="stat-label">Active Sessions</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon total">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                <line x1="3" y1="9" x2="21" y2="9"/>
                                <line x1="9" y1="21" x2="9" y2="9"/>
                            </svg>
                        </div>
                        <div class="stat-info">
                            <span class="stat-value">4</span>
                            <span class="stat-label">Total Sessions</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon agents">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/>
                                <circle cx="7.5" cy="14.5" r="1.5" fill="currentColor"/>
                                <circle cx="16.5" cy="14.5" r="1.5" fill="currentColor"/>
                            </svg>
                        </div>
                        <div class="stat-info">
                            <span class="stat-value">2</span>
                            <span class="stat-label">Configured Agents</span>
                        </div>
                    </div>
                </div>

                <!-- Search -->
                <div class="vault-pd-search" role="search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="search" id="sessionSearch" placeholder="Search Agentic Workspaces…" autocomplete="off" aria-label="Search agentic workspaces" oninput="filterSessions()">
                </div>

                <!-- Sessions List -->
                <div class="models-table-wrap">
                    <table class="models-data-table" id="sessionsTable" aria-label="Agentic Workspaces">
                        <thead>
                            <tr>
                                <th class="models-table-status" scope="col">Status</th>
                                <th scope="col">Workspace</th>
                                <th scope="col">Agent</th>
                                <th scope="col">Runtime</th>
                                <th scope="col" style="text-align:right">Time</th>
                                <th scope="col" style="text-align:right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="sessionsTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/scripts.js"></script>
    <script>
        // Check if modules are enabled
        function isSkillsModuleEnabled() {
            try {
                const settings = localStorage.getItem('kaidenSettings');
                if (settings) {
                    const parsed = JSON.parse(settings);
                    if (parsed.modules && parsed.modules.skillsEnabled === false) {
                        return false;
                    }
                }
                return true;
            } catch (e) {
                return true;
            }
        }

        function isMcpModuleEnabled() {
            try {
                const settings = localStorage.getItem('kaidenSettings');
                if (settings) {
                    const parsed = JSON.parse(settings);
                    if (parsed.modules && parsed.modules.mcpEnabled === false) {
                        return false;
                    }
                }
                return true;
            } catch (e) {
                return true;
            }
        }

        // Hide module-specific resource tags if modules are disabled
        document.addEventListener('DOMContentLoaded', function() {
            if (!isSkillsModuleEnabled()) {
                document.querySelectorAll('.session-row-tag.skill').forEach(tag => {
                    tag.style.display = 'none';
                });
            }

            if (!isMcpModuleEnabled()) {
                document.querySelectorAll('.session-row-tag.mcp').forEach(tag => {
                    tag.style.display = 'none';
                });
            }
        });

        function filterSessions() {
            const filter = document.getElementById('sessionSearch').value.toLowerCase();
            document.querySelectorAll('#sessionsTableBody tr').forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(filter) ? '' : 'none';
            });
        }

        function deleteSession(sessionId) {
            if (confirm('Delete this workspace? This cannot be undone.')) {
                const row = event.target.closest('tr');
                if (row) row.remove();
            }
        }

        function startSession(sessionId) {
            const row = event.target.closest('tr');
            const dot = row.querySelector('.sess-status-dot');
            if (dot) { dot.className = 'sess-status-dot running'; }
        }

        function stopSession(sessionId) {
            if (confirm('Are you sure you want to stop this session?')) {
                const row = event.target.closest('tr');
                const dot = row.querySelector('.sess-status-dot');
                if (dot) { dot.className = 'sess-status-dot stopped'; }
            }
        }
    </script>
</body>
</html>
